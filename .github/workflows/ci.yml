name: CI
# Roda só no PR para a main (o push no branch e o merge repetiam o mesmo teste),
# numa máquina só (cada máquina é cobrada por 1 minuto no mínimo) e só a parte que mudou.
# Decisão do Moisés, 7/nov/2026.
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: O que mudou
        id: mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "banco=true" >> "$GITHUB_OUTPUT"; echo "coletor=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > mudou.txt
          cat mudou.txt
          tem() { grep -qE "$1" mudou.txt && echo true || echo false; }
          echo "banco=$(tem '^(supabase/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "coletor=$(tem '^(supabase/|tools/coletar/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

      - name: Postgres 16
        if: steps.mudou.outputs.banco == 'true' || steps.mudou.outputs.coletor == 'true'
        timeout-minutes: 8
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update -qq -o Acquire::Retries=3
            sudo apt-get install -y -qq postgresql-16
          fi

      - name: Banco (migrations + regras)
        if: steps.mudou.outputs.banco == 'true'
        run: bash supabase/tests/run.sh

      - uses: actions/setup-python@v5
        if: steps.mudou.outputs.coletor == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/coletar/pyproject.toml

      - name: Coletor
        if: steps.mudou.outputs.coletor == 'true'
        working-directory: tools/coletar
        run: |
          pip install -e ".[teste]"
          python -m pytest -q
