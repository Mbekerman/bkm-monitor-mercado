name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  banco:
    name: Banco (migrations + regras)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16
      - run: bash supabase/tests/run.sh

  coletor:
    name: Coletor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16
      - run: pip install -e "./tools/coletar[teste]"
      - run: python -m pytest -q
        working-directory: tools/coletar
